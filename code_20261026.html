<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>便携提词器</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiGOWwj+WcsOWbvSIsInNob3J0X25hbWUiOiLnlLDorr7lhazov48iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMDAwMDAwIiwidGhlbWVfY29sb3IiOiIjMDAwMDAwIiwiaWNvbnMiOlt7InNyYyI6ImRhdGE6aW1hZ2UvcG5nO2Jhc2U2NCwgIiwic2l6ZXMiOiIxOTJ4MTkyIiwidHlwZSI6ImltYWdlL3BuZyJ9XX0=">
<link rel="apple-touch-icon" href="data:image/png;base64,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#fff;font-family:system-ui}
.page{width:100%;height:100%;position:relative}
.back-btn{position:absolute;top:24rpx;left:24rpx;width:72rpx;height:72rpx;border-radius:50%;background:rgba(30,30,30,0.6);z-index:99;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32rpx}
.teleprompter-wrap{position:absolute;top:0;left:0;right:0;bottom:140rpx;overflow:hidden !important;box-sizing:border-box}
.teleprompter-wrap.landscape{width:100%;height:100%;overflow:hidden !important}
.scroll-text{width:100%;height:100%;padding:40rpx 24rpx;box-sizing:border-box;white-space:pre-line;word-break:break-word;color:#fff;line-height:1.8}
.bottom-menu{position:absolute;bottom:24rpx;left:50%;transform:translateX(-50%);width:640rpx;height:100rpx;background:rgba(40,40,40,1);border-radius:60rpx;display:flex;align-items:center;justify-content:space-around;z-index:99;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.menu-item{width:76rpx;height:76rpx;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36rpx}
.sub-panel{position:absolute;left:50%;bottom:160rpx;transform:translateX(-50%);width:680rpx;background:rgba(20,20,20,0.92);border-radius:24rpx;padding:32rpx;box-sizing:border-box;z-index:100}
.sub-header{display:flex;justify-content:flex-end;margin-bottom:24rpx}
.close-sub{color:#fff;font-size:32rpx;padding:12rpx}
.sub-row{display:flex;align-items:center;margin-bottom:32rpx;color:#fff;gap:16rpx}
.slider{flex:1}
.btn-group button{width:56rpx;height:56rpx;line-height:56rpx;padding:0;margin:0 4rpx}
.color-list{display:flex;gap:16rpx}
.color-item{width:48rpx;height:48rpx;border-radius:50%}
</style>
</head>
<body>
<div class="page">
  <div class="back-btn" onclick="goEdit()">←</div>
  <div ref="teleWrap" class="teleprompter-wrap" :class="{landscape:isLandscape}">
    <div ref="scrollView" class="scroll-text" id="scrollDom">
      <span id="textDom"></span>
    </div>
  </div>
  <div class="bottom-menu">
    <div class="menu-item" onclick="resetPlay();vibrate()">↺</div>
    <div class="menu-item" onclick="togglePlay();vibrate()"><span id="playIcon">▶</span></div>
    <div class="menu-item" onclick="toggleLandscape();vibrate()">⟲</div>
    <div class="menu-item" onclick="toggleSubMenu();vibrate()">⋀</div>
  </div>
  <div id="subPanel" class="sub-panel" style="display:none">
    <div class="sub-header"><div class="close-sub" onclick="toggleSubMenu()">✕</div></div>
    <div class="sub-row">
      <text>速度</text>
      <input type="range" min="1" max="20" id="speedSlider" class="slider">
      <div class="btn-group">
        <button onclick="speedVal--">−</button>
        <button onclick="speedVal++">+</button>
      </div>
    </div>
    <div class="sub-row">
      <text>字号</text>
      <input type="range" min="16" max="120" id="fontSlider" class="slider">
      <div class="btn-group">
        <button onclick="fontSizeVal--">−</button>
        <button onclick="fontSizeVal++">+</button>
      </div>
    </div>
    <div class="sub-row">
      <text>文字颜色</text>
      <div class="color-list">
        <div class="color-item" style="background:#fff" onclick="setFontColor('#ffffff')"></div>
        <div class="color-item" style="background:#ffff00" onclick="setFontColor('#ffff00')"></div>
        <div class="color-item" style="background:#ff4444" onclick="setFontColor('#ff4444')"></div>
        <div class="color-item" style="background:#44ff44" onclick="setFontColor('#44ff44')"></div>
        <div class="color-item" style="background:#44ccff" onclick="setFontColor('#44ccff')"></div>
      </div>
    </div>
    <div class="sub-row">
      <text>镜像翻转</text>
      <input type="checkbox" id="mirrorCheck">
    </div>
  </div>
</div>
<script>
let speedVal = 8;
let fontSizeVal = 48;
let fontColor = "#ffffff";
let isMirror = false;
let isLandscape = false;
let showSubMenu = false;
let isPlaying = false;
let timer = null;
let scrollTop = 0;
const colorList=["#fff","#ffff00","#ff4444","#44ff44","#44ccff"];
const urlParams = new URLSearchParams(window.location.search);
let currentScript = decodeURIComponent(urlParams.get('script') || "测试台词，这里输入你的提词文案");
document.getElementById('textDom').innerText = currentScript;
const textDom = document.getElementById('textDom');
const scrollDom = document.getElementById('scrollDom');
function updateTextStyle(){
  let style = `font-size:${fontSizeVal}px;color:${fontColor};line-height:1.8`;
  if(isMirror) style += ";transform:scaleX(-1);display:inline-block";
  if(isLandscape) style += ";transform-origin:center;transform:rotate(90deg)";
  textDom.style.cssText = style;
}
updateTextStyle();
document.getElementById('speedSlider').value = speedVal;
document.getElementById('speedSlider').oninput = (e)=>{speedVal = Number(e.target.value)}
document.getElementById('fontSlider').value = fontSizeVal;
document.getElementById('fontSlider').oninput = (e)=>{fontSizeVal = Number(e.target.value);updateTextStyle()}
document.getElementById('mirrorCheck').onchange = (e)=>{isMirror = e.target.checked;updateTextStyle()}
function setFontColor(c){fontColor = c;updateTextStyle()}
function vibrate(){
  if(navigator.vibrate) navigator.vibrate(30)
}
function goEdit(){history.back()}
function togglePlay(){
  isPlaying = !isPlaying;
  document.getElementById('playIcon').innerText = isPlaying ? '⏸' : '▶';
  if(isPlaying){
    timer = setInterval(()=>{
      scrollTop += speedVal * 0.4;
      scrollDom.scrollTop = scrollTop;
    },40)
  }else{
    clearInterval(timer)
  }
}
function stopPlay(){isPlaying=false;clearInterval(timer);document.getElementById('playIcon').innerText='▶'}
function resetPlay(){
  stopPlay();
  scrollTop = 0;
  scrollDom.scrollTop = 0;
}
function toggleLandscape(){
  isLandscape = !isLandscape;
  updateTextStyle();
}
function toggleSubMenu(){
  showSubMenu = !showSubMenu;
  document.getElementById('subPanel').style.display = showSubMenu ? 'block' : 'none';
}
//陀螺仪
if(navigator.gyroscope){
  const gyro = new Gyroscope({frequency:20});
  gyro.onreading = ()=>{
    const x = gyro.x;
    if(Math.abs(x)>5){
      if(!isLandscape){isLandscape=true;updateTextStyle()}
    }else{
      if(isLandscape){isLandscape=false;updateTextStyle()}
    }
  }
  gyro.start();
}
</script>
</body>
</html>
